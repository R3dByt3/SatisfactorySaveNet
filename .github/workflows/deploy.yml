name: Build and Deploy to NuGet

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Get version from release
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="0.0.0"
          fi
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore SatisfactorySaveNet.sln

      - name: Build
        run: dotnet build SatisfactorySaveNet.sln --configuration Release --no-restore /p:Version=${{ steps.get_version.outputs.version }} /p:GeneratePackageOnBuild=false

      - name: Test
        run: dotnet test SatisfactorySaveNet.sln --configuration Release --no-build --verbosity normal

      - name: Pack with version
        run: |
          dotnet pack SatisfactorySaveNet.Abstracts/SatisfactorySaveNet.Abstracts.csproj --configuration Release --no-build --output ./nupkgs /p:Version=${{ steps.get_version.outputs.version }}
          dotnet pack SatisfactorySaveNet/SatisfactorySaveNet.csproj --configuration Release --no-build --output ./nupkgs /p:Version=${{ steps.get_version.outputs.version }}

      - name: Publish to NuGet
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
